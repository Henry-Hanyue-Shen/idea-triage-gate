name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate skill structure
        run: python tests/run_skill_validation.py
      - name: Validate example gate
        run: python scripts/validate_assessment.py examples/assessment-v2.json
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"

